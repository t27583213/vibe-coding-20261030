<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數位碼錶 - 扁平化科技風</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Orbitron / Share Tech Mono for Sci-Fi aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            techBg: '#0b1320',
            techCard: '#0f1c2e',
            cyanGlow: '#00f2ff',
            blueGlow: '#0088ff',
            darkBtn: '#1b2a3f',
            darkBtnHover: '#243752',
            disabledBtn: '#121d2b',
          },
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            tech: ['Orbitron', 'sans-serif'],
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          boxShadow: {
            cyanGlow: '0 0 25px rgba(0, 242, 255, 0.45), inset 0 0 15px rgba(0, 242, 255, 0.25)',
            btnGlow: '0 0 20px rgba(0, 242, 255, 0.6)',
            ringGlow: '0 0 30px rgba(0, 200, 255, 0.35)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b1320;
      color: #e2e8f0;
      font-family: 'Noto Sans TC', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* Circuit Background Canvas Effect */
    .bg-circuit {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 150, 255, 0.08) 0%, transparent 70%),
        linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    /* Outer Ring Rotating Glow Animation */
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .rotate-active {
      animation: rotateRing 12s linear infinite;
    }

    /* Pulse animation for active running state */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 242, 255, 0.6)); }
      50% { filter: drop-shadow(0 0 22px rgba(0, 242, 255, 0.95)); }
    }

    .glow-pulse {
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* Smooth transitions for SVG stroke dashboard */
    .progress-ring__circle {
      transition: stroke-dashoffset 0.1s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Custom scrollbar for lap log modal if opened */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f1c2e;
    }
    ::-webkit-scrollbar-thumb {
      background: #0088ff;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-techBg min-h-screen flex items-center justify-center p-4 bg-circuit relative">

  <!-- Circuit Line Graphics (Left & Right Overlay decorative SVG) -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-30 flex justify-between items-center px-4 md:px-12">
    <!-- Left Circuit -->
    <svg class="w-48 h-96 hidden md:block" viewBox="0 0 200 400" fill="none" stroke="#00f2ff" stroke-width="1.5">
      <path d="M 10 50 L 80 50 L 130 100 L 130 250 L 70 310 L 10 310" stroke-dasharray="4 4" />
      <circle cx="10" cy="50" r="4" fill="#00f2ff" />
      <circle cx="10" cy="310" r="4" fill="#00f2ff" />
      <path d="M 30 120 L 90 120 L 150 180 L 190 180" />
      <circle cx="190" cy="180" r="3" fill="#00f2ff" />
    </svg>
    
    <!-- Right Circuit -->
    <svg class="w-48 h-96 hidden md:block" viewBox="0 0 200 400" fill="none" stroke="#00f2ff" stroke-width="1.5">
      <path d="M 190 50 L 120 50 L 70 100 L 70 250 L 130 310 L 190 310" stroke-dasharray="4 4" />
      <circle cx="190" cy="50" r="4" fill="#00f2ff" />
      <circle cx="190" cy="310" r="4" fill="#00f2ff" />
      <path d="M 170 280 L 110 280 L 50 220 L 10 220" />
      <circle cx="10" cy="220" r="3" fill="#00f2ff" />
    </svg>
  </div>

  <!-- Main Container -->
  <main class="relative w-full max-w-md bg-techCard/80 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-cyanGlow/20 shadow-2xl flex flex-col items-center justify-between min-h-[640px] z-10">

    <!-- Top Navigation / Header -->
    <header class="w-full flex items-center justify-between mb-2">
      <button id="settingsBtn" title="設定" class="text-cyanGlow/70 hover:text-cyanGlow transition-colors duration-200 p-2 rounded-full hover:bg-white/5 active:scale-95">
        <i class="fa-solid fa-gear text-2xl"></i>
      </button>
      <h1 class="text-xl sm:text-2xl font-bold tracking-widest text-slate-100 font-tech flex items-center gap-2">
        <span>數位碼錶</span>
      </h1>
      <button id="lapListBtn" title="圈速紀錄" class="text-cyanGlow/70 hover:text-cyanGlow transition-colors duration-200 p-2 rounded-full hover:bg-white/5 active:scale-95 relative">
        <i class="fa-solid fa-list-ol text-xl"></i>
        <span id="lapBadge" class="hidden absolute -top-1 -right-1 bg-cyanGlow text-techBg text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </button>
    </header>

    <!-- Center Interactive Sci-Fi Dial Display -->
  <section class="relative my-auto flex items-center justify-center py-4">
    
    <!-- Background Image container layer for the dial area -->
    <div class="absolute w-[290px] h-[290px] sm:w-[310px] sm:h-[310px] rounded-full overflow-hidden shadow-[0_0_25px_rgba(0,242,255,0.25)] border border-cyanGlow/30">
      <img src="https://i.postimg.cc/k4PQ1vwZ/e9b2c1b9310fa370205d4d217cc1f4fe.jpg" 
           alt="Tech Background" 
           class="w-full h-full object-cover opacity-90 mix-blend-luminosity hover:mix-blend-normal transition-all duration-500"
           onerror="this.style.display='none'" />
      <div class="absolute inset-0 bg-techBg/40 backdrop-brightness-90"></div>
    </div>

    <!-- Tech Circuit Lines around circle (matching reference wireframe) -->
    <svg class="absolute w-[310px] h-[310px] pointer-events-none opacity-40" viewBox="0 0 300 300" fill="none" stroke="#00f2ff">
        <!-- Outer Left Tech Lines -->
        <path d="M 30 90 L 10 90 L 10 50 L -20 20" stroke-width="1.2" />
        <circle cx="30" cy="90" r="2.5" fill="#00f2ff" />
        <path d="M 10 210 L -10 210 L -20 230" stroke-width="1.2" />
        <!-- Outer Right Tech Lines -->
        <path d="M 270 90 L 290 90 L 310 70" stroke-width="1.2" />
        <path d="M 270 210 L 290 210 L 310 210" stroke-width="1.2" />
        <circle cx="270" cy="210" r="2.5" fill="#00f2ff" />
      </svg>

      <!-- SVG Ring Dashboard Display -->
      <div class="relative w-[270px] h-[270px] sm:w-[290px] sm:h-[290px] flex items-center justify-center">
        
        <!-- Rotating Decorative Tech Notch Ring -->
        <svg id="techRing" class="absolute inset-0 w-full h-full text-cyanGlow/40 opacity-70 transition-transform duration-700" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="95" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 6" />
          <circle cx="100" cy="100" r="88" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="15 35 5 35" />
        </svg>

        <!-- Dynamic Circular Stopwatch Progress Ring -->
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 200 200">
          <!-- Outer track ring -->
          <circle cx="100" cy="100" r="78" stroke="#132338" stroke-width="10" fill="none" />
          <!-- Animated Progress Cyan Arc -->
          <circle id="progressArc" class="progress-ring__circle" cx="100" cy="100" r="78" 
                  stroke="url(#cyanGradient)" stroke-width="10" stroke-linecap="round" fill="none" 
                  stroke-dasharray="490.08" stroke-dashoffset="0" />
          <!-- Gradients -->
          <defs>
            <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f2ff" />
              <stop offset="100%" stop-color="#0088ff" />
            </linearGradient>
          </defs>
        </svg>

        <!-- Center Digital Content Stack -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 z-10">
          
          <!-- Main HH:MM:SS Display -->
          <div id="mainDisplay" class="font-mono text-3xl sm:text-4xl font-extrabold tracking-tight text-white drop-shadow-[0_0_12px_rgba(0,242,255,1)]">
            00:00:00
          </div>
          
          <!-- Milliseconds (.ms) Display -->
          <div id="msDisplay" class="font-mono text-lg sm:text-xl text-cyanGlow font-bold mt-[-2px] tracking-widest drop-shadow-[0_0_8px_rgba(0,242,255,0.8)]">
            .00
          </div>

          <!-- LAP Counter & Total Time Display (Matching reference sub-info) -->
          <div class="mt-3 flex flex-col items-center gap-0.5 text-xs sm:text-sm font-mono text-slate-200 font-medium tracking-wider drop-shadow-md">
            <div id="lapCountDisplay" class="text-cyanGlow font-semibold">
              LAP: 00
            </div>
            <div id="totDisplay" class="text-slate-300">
              TOT: 00:00:00.00
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Control Buttons (Matching Wireframe: Reset Left, Start/Pause Right) -->
    <footer class="w-full flex items-center justify-around gap-6 pt-4 pb-2">
      
      <!-- Left Button: Reset (重設) -->
      <button id="resetBtn" disabled
              class="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-disabledBtn border border-slate-700/50 flex flex-col items-center justify-center text-slate-500 cursor-not-allowed opacity-50 transition-all duration-300 shadow-lg group">
        <i class="fa-solid fa-rotate-right text-2xl sm:text-3xl mb-1 group-hover:rotate-180 transition-transform duration-500"></i>
        <span class="text-base sm:text-lg font-bold tracking-wider">重設</span>
      </button>

      <!-- Right Button: Primary Start / Pause / Continue (開始 / 暫停 / 繼續) -->
      <button id="startPauseBtn" 
              class="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-gradient-to-br from-cyanGlow to-blue-600 border-2 border-cyanGlow flex flex-col items-center justify-center text-slate-950 shadow-btnGlow cursor-pointer hover:scale-105 active:scale-95 transition-all duration-300 font-bold">
        <i id="startPauseIcon" class="fa-solid fa-play text-2xl sm:text-3xl mb-1 ml-1 text-slate-950"></i>
        <span id="startPauseText" class="text-base sm:text-lg tracking-wider text-slate-950">開始</span>
      </button>

    </footer>

    <!-- Lap Record Modal Overlay -->
    <div id="lapModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
      <div class="bg-techCard border border-cyanGlow/40 rounded-2xl w-full max-w-xs sm:max-w-md p-5 shadow-2xl flex flex-col max-h-[80vh]">
        <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-3">
          <h2 class="text-lg font-bold text-cyanGlow font-tech flex items-center gap-2">
            <i class="fa-solid fa-stopwatch"></i> 圈速記錄 (Laps)
          </h2>
          <button id="closeLapModal" class="text-slate-400 hover:text-white text-xl p-1">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="lapListContainer" class="overflow-y-auto flex-1 space-y-2 pr-1 text-sm font-mono">
          <p class="text-slate-500 text-center py-6">目前尚無圈速紀錄</p>
        </div>
      </div>
    </div>

  </main>

  <!-- JavaScript App Logic -->
  <script>
    // State Variables
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;
    let isRunning = false;
    let isPaused = false;
    let lapTimes = [];
    let lastLapTotalTime = 0;

    // DOM Elements
    const mainDisplay = document.getElementById('mainDisplay');
    const msDisplay = document.getElementById('msDisplay');
    const lapCountDisplay = document.getElementById('lapCountDisplay');
    const totDisplay = document.getElementById('totDisplay');
    
    const startPauseBtn = document.getElementById('startPauseBtn');
    const startPauseIcon = document.getElementById('startPauseIcon');
    const startPauseText = document.getElementById('startPauseText');
    
    const resetBtn = document.getElementById('resetBtn');
    const techRing = document.getElementById('techRing');
    const progressArc = document.getElementById('progressArc');

    const lapListBtn = document.getElementById('lapListBtn');
    const lapModal = document.getElementById('lapModal');
    const closeLapModal = document.getElementById('closeLapModal');
    const lapListContainer = document.getElementById('lapListContainer');
    const lapBadge = document.getElementById('lapBadge');

    // Progress Ring Calculation (Circumference ~490.08)
    const CIRCUMFERENCE = 2 * Math.PI * 78;

    // Format Time Helper Function (ms to object formatted)
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const milliseconds = Math.floor((ms % 1000) / 10);

      const pad = (num, size = 2) => String(num).padStart(size, '0');

      return {
        main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
        ms: `.${pad(milliseconds)}`,
        full: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(milliseconds)}`
      };
    }

    // Update Display Output
    function updateDisplay() {
      const formatted = formatTime(elapsedTime);
      mainDisplay.textContent = formatted.main;
      msDisplay.textContent = formatted.ms;
      totDisplay.textContent = `TOT: ${formatted.full}`;

      // Update ring arc animation based on seconds modulo 60
      const currentSecMs = elapsedTime % 60000;
      const progressRatio = currentSecMs / 60000;
      const offset = CIRCUMFERENCE - (progressRatio * CIRCUMFERENCE);
      progressArc.style.strokeDashoffset = offset;
    }

    // Workflow State Handlers according to Mermaid Diagram
    
    // 1. Start Action
    function startTimer() {
      startTime = Date.now() - elapsedTime;
      timerInterval = setInterval(() => {
        elapsedTime = Date.now() - startTime;
        updateDisplay();
      }, 10);

      isRunning = true;
      isPaused = false;

      // UI Changes: 「開始」/「繼續」 -> 「暫停」
      startPauseText.textContent = '暫停';
      startPauseIcon.className = 'fa-solid fa-pause text-2xl sm:text-3xl mb-1 text-slate-950';

      // Enable Reset Button
      enableResetBtn();

      // Visual Glow Animations
      techRing.classList.add('rotate-active');
      startPauseBtn.classList.add('glow-pulse');
    }

    // 2. Pause Action
    function pauseTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      isPaused = true;

      // UI Changes: 「暫停」 -> 「繼續」
      startPauseText.textContent = '繼續';
      startPauseIcon.className = 'fa-solid fa-play text-2xl sm:text-3xl mb-1 ml-1 text-slate-950';

      // Keep Reset Button enabled (or record lap if clicked separately)
      techRing.classList.remove('rotate-active');
      startPauseBtn.classList.remove('glow-pulse');
    }

    // 3. Reset Action -> Initial Index State
    function resetTimer() {
      clearInterval(timerInterval);
      elapsedTime = 0;
      isRunning = false;
      isPaused = false;
      lapTimes = [];
      lastLapTotalTime = 0;

      // Reset Displays
      updateDisplay();
      lapCountDisplay.textContent = 'LAP: 00';
      lapBadge.textContent = '0';
      lapBadge.classList.add('hidden');

      // Reset Start/Pause Button to initial "開始"
      startPauseText.textContent = '開始';
      startPauseIcon.className = 'fa-solid fa-play text-2xl sm:text-3xl mb-1 ml-1 text-slate-950';

      // Reset Ring offset & animation
      progressArc.style.strokeDashoffset = 0;
      techRing.classList.remove('rotate-active');
      startPauseBtn.classList.remove('glow-pulse');

      // Disable Reset Button
      disableResetBtn();
      renderLapList();
    }

    // Reset Button State Modifiers
    function enableResetBtn() {
      resetBtn.disabled = false;
      resetBtn.className = "w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-darkBtn hover:bg-darkBtnHover border border-cyanGlow/50 flex flex-col items-center justify-center text-cyanGlow cursor-pointer opacity-100 transition-all duration-300 shadow-lg active:scale-95 group";
    }

    function disableResetBtn() {
      resetBtn.disabled = true;
      resetBtn.className = "w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-disabledBtn border border-slate-700/50 flex flex-col items-center justify-center text-slate-500 cursor-not-allowed opacity-50 transition-all duration-300 shadow-lg group";
    }

    // Record Lap functionality
    function recordLap() {
      if (elapsedTime === 0) return;

      const lapDuration = elapsedTime - lastLapTotalTime;
      lastLapTotalTime = elapsedTime;

      lapTimes.unshift({
        lapNum: lapTimes.length + 1,
        lapTime: formatTime(lapDuration).full,
        totalTime: formatTime(elapsedTime).full
      });

      const padNum = String(lapTimes.length).padStart(2, '0');
      lapCountDisplay.textContent = `LAP: ${padNum}`;
      lapBadge.textContent = lapTimes.length;
      lapBadge.classList.remove('hidden');

      renderLapList();
    }

    // Render Lap Modal List
    function renderLapList() {
      if (lapTimes.length === 0) {
        lapListContainer.innerHTML = `<p class="text-slate-500 text-center py-6">目前尚無圈速紀錄</p>`;
        return;
      }

      lapListContainer.innerHTML = lapTimes.map(item => `
        <div class="flex items-center justify-between bg-slate-900/80 px-3 py-2 rounded-lg border border-slate-800 hover:border-cyanGlow/30 transition-colors">
          <span class="text-cyanGlow font-bold"># ${String(item.lapNum).padStart(2, '0')}</span>
          <span class="text-slate-200">分圈: ${item.lapTime}</span>
          <span class="text-slate-400 text-xs">總計: ${item.totalTime}</span>
        </div>
      `).join('');
    }

    // Button Event Listeners matching State Flow Diagram
    startPauseBtn.addEventListener('click', () => {
      if (!isRunning) {
        startTimer(); // Index -> Start OR Pause -> Continue
      } else {
        pauseTimer(); // Start -> Pause
      }
    });

    resetBtn.addEventListener('click', () => {
      // If user clicks reset during timer or paused state
      resetTimer();
    });

    // Modal Events
    lapListBtn.addEventListener('click', () => {
      // If running and user clicks lap count button, auto-record a lap too
      if (isRunning) {
        recordLap();
      }
      lapModal.classList.remove('opacity-0', 'pointer-events-none');
    });

    closeLapModal.addEventListener('click', () => {
      lapModal.classList.add('opacity-0', 'pointer-events-none');
    });

    lapModal.addEventListener('click', (e) => {
      if (e.target === lapModal) {
        lapModal.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    // Settings icon placeholder toast
    document.getElementById('settingsBtn').addEventListener('click', () => {
      alert('【數位碼錶設定】\n• 模式：標準碼錶\n• 精度：1/100 秒 (毫秒)\n• 主題：扁平化科技風');
    });

    // Initial load setup
    updateDisplay();
  </script>
</body>
</html>
